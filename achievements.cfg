#textdomain wesnoth-WoL_Map_Pack

# ------------------------------------------------------
# Achievements!
# Unbreakable: win the race without losing a single unit
# Hardcore: Kill 65 enemies during the race and win
# Capitalist: Finish the race with 75 gold remaining
# Blitz: Finish the race in 40 turns or less
# ------------------------------------------------------

[achievement_group]
    content_for=wesnoth_multiplayer_dimaga_beach_race_achievements
    display_name= _ "Race for Dimaga Beach"

    [achievement]
        id=wol_dimaga_beach_race_unbreakable
        name= _ "Unbreakable"
        description= _"Win the race without losing a single unit"
        description_completed= _ "Won the race without losing a single unit"
        icon="data/core/images/items/armor-golden.png"
    [/achievement]

    [achievement]
        id=wol_dimaga_beach_race_hardcore
        name= _ "Hardcore"
        description= _"Kill 65 enemy units during the race and win"
        description_completed= _ "Killed 65 enemy units during the race and win"
        icon="data/core/images/items/burial.png"
    [/achievement]

    [achievement]
        id=wol_dimaga_beach_race_capitalist
        name= _ "Capitalist"
        description= _"Finish the race with 75 remaining gold"
        description_completed= _ "Finished the race with 75 remaining gold"
        icon="data/core/images/items/gold-coins-medium.png"
    [/achievement]

    [achievement]
        id=wol_dimaga_beach_race_blitz
        name= _ "Blitz"
        description= _"Finish the race in 40 turns or fewer"
        description_completed= _ "Finished the race in 40 turns or fewer"
        icon="data/core/images/units/elves-wood/scout/scout-melee-3.png~RC(magenta>green)"
    [/achievement]
[/achievement_group]
