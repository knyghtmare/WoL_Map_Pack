#textdomain wesnoth-WoL_Map_Pack
[multiplayer]
    id=multiplayer_2p_Twin_Rivers
    name= _ "2p — Twin Rivers"
    description= _ "As winter descends on a calm mountain valley, two factions wage a bloody war. By Aethaeryn."

    map_file=2p_Twin_Rivers.map

    turns=-1

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}
    random_start_time=no

    experience_modifier=70

    [side]
        side=1
        controller=human
        team_name=North
        user_team_name= _ "North"
        canrecruit=yes
        gold=100
        income=0
        fog=yes
        village_gold=2
    [/side]

    [side]
        side=2
        controller=human
        team_name=South
        user_team_name= _ "South"
        canrecruit=yes
        gold=100
        income=0
        fog=yes
        village_gold=2
    [/side]

    [event]
        name=prestart
        [objectives]
            side=0
            [objective]
                description= _ "Kill the enemy leader."
                condition=win
            [/objective]
            [objective]
                description= _ "Death of your leader."
                condition=lose
            [/objective]
        [/objectives]
    [/event]
[/multiplayer]
