#textdomain wesnoth-WoL_Map_Pack
[multiplayer]
    id=multiplayer_2p_Arena_of_the_Merciless
    name= _ "2p — Arena of the Merciless"
    description= _ "A brutal arena where two factions fight to the bitter end. By Lord-Knightmare."

    map_file=2p_Arena_of_the_Merciless.map

    turns=-1

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}
    random_start_time=no

    experience_modifier=70

    [side]
        side=1
        controller=human
        team_name=North
        user_team_name= _ "North"
        canrecruit=yes
        gold=100
        income=0
        fog=yes
        village_gold=2
    [/side]

    [side]
        side=2
        controller=human
        team_name=South
        user_team_name= _ "South"
        canrecruit=yes
        gold=100
        income=0
        fog=yes
        village_gold=2
    [/side]

    [event]
        name=prestart
        [objectives]
            side=0
            [objective]
                description= _ "Kill the enemy leader."
                condition=win
            [/objective]
            [objective]
                description= _ "Death of your leader."
                condition=lose
            [/objective]
        [/objectives]
        [capture_village]
            side=2
            x,y=6,18
        [/capture_village]
    [/event]
[/multiplayer]
