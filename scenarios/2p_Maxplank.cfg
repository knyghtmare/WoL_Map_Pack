#textdomain wesnoth-WoL_Map_Pack

[multiplayer]
    id=multiplayer_Maxplank
    name= _ "2p — Maxplank"
    description= _ "Created by Horus2."
    map_file=2p_Maxplank.map
    random_start_time="no"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        [ai]
            villages_per_scout=12
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=east
        user_team_name= _ "teamname^Southeast"
        gold=125
        fog=yes
    [/side]

    [side]
        [ai]
            villages_per_scout=12
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=west
        user_team_name= _ "teamname^Northwest"
        gold=125
        fog=yes
        [village]
            x=16
            y=4
        [/village]
    [/side]

