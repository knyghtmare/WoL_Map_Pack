#textdomain wesnoth-WoL_Map_Pack

[multiplayer]
    id=multiplayer_8p_Aleris
    name= _ "8p — Aleris"
    map_file=8p_Aleris.map
    description= _ "An 8-player multiplayer map for Battle for Wesnoth, built around a symmetric octagonal layout with a contested central stronghold — a King of the Hill style objective at the heart of the battlefield. By Felix Lahaie."
    random_start_time="no"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        side=1
        canrecruit=yes
        controller=human
        team_name=player1
        user_team_name= _ "teamname^Player 1"
        gold=100
        fog=yes
    [/side]

