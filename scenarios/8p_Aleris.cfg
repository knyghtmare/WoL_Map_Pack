#textdomain wesnoth-WoL_Map_Pack

#define SPAWN_HEIR SIDE PLACEMENT
    [store_side]
        side={SIDE}
    [/store_side]
    # Get the faction leader list of the side.
    [lua]
        code=<<
            local t = ...
            for faction in wml.child_range(wesnoth.scenario.era, "multiplayer_side") do
                if faction.id == t.faction then
                    wml.variables.random = faction.leader
                    return
                end
            end
            >>
        [args]
            faction=$side.faction
        [/args]
    [/lua]
    # Pick a random leader from the list.
    {RANDOM $random}
    [store_unit_type]
        type=$random
    [/store_unit_type]
    # Give this leader whichever role is unfilled.
    [if]
        [have_unit]
            side=$side.side
            role=heir
        [/have_unit]
        [then]
            {VARIABLE role reclaimer}
        [/then]
        [else]
            {VARIABLE role heir}
        [/else]
    [/if]
    # Spawn it.
    [unit]
        side=$side.side
        type=$random
        canrecruit=yes
        role=$role
        recall_cost=$unit_type.cost
        placement={PLACEMENT}
    [/unit]
#enddef

[multiplayer]
    id=multiplayer_8p_Aleris
    name= _ "8p — Aleris"
    map_file=8p_Aleris.map
    description= _ "An 8-player multiplayer map for Battle for Wesnoth, built around a symmetric octagonal layout with a contested central stronghold — a King of the Hill style objective at the heart of the battlefield. By Felix Lahaie."
    random_start_time="no"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        side=1
        canrecruit=yes
        controller=human
        team_name=player1
        user_team_name= _ "teamname^Player 1"
        gold=100
        fog=yes
    [/side]

    [side]
        side=2
        canrecruit=yes
        controller=human
        team_name=player2
        user_team_name= _ "teamname^Player 2"
        gold=100
        fog=yes
    [/side]

    [side]
        side=3
        canrecruit=yes
        controller=human
        team_name=player3
        user_team_name= _ "teamname^Player 3"
        gold=100
        fog=yes
    [/side]

    [side]
        side=4
        canrecruit=yes
        controller=human
        team_name=player4
        user_team_name= _ "teamname^Player 4"
        gold=100
        fog=yes
    [/side]

    [side]
        side=5
        canrecruit=yes
        controller=human
        team_name=player5
        user_team_name= _ "teamname^Player 5"
        gold=100
        fog=yes
    [/side]

    [side]
        side=6
        canrecruit=yes
        controller=human
        team_name=player6
        user_team_name= _ "teamname^Player 6"
        gold=100
        fog=yes
    [/side]

    [side]
        side=7
        canrecruit=yes
        controller=human
        team_name=player7
        user_team_name= _ "teamname^Player 7"
        gold=100
        fog=yes
    [/side]

    [side]
        side=8
        canrecruit=yes
        controller=human
        team_name=player8
        user_team_name= _ "teamname^Player 8"
        gold=100
        fog=yes
    [/side]

    # central location guard side
    [side]
        side=9
        controller=ai
        controller_lock=yes
        allow_player=no
        disallow_shuffle=yes
        team_name=guard
        team_lock=yes
        user_team_name= _ "Guardians of the Temple"
        color=gold
        color_lock=yes
        # note: this side is facing around eight player sides
        # so we make it somewhat fair by giving more gold
        gold=600
        [ai]
            villages_per_scout=16
        [/ai]
    [/side]

    # scenario options
    [options]
        [slider]
            id="bonus_income"
            default=15
            min=5
            max=40
            name= _ "Hill Bonus Income"
            description= _ "The amount of extra gold per turn granted to the leader who occupies the hill keep."
        [/slider]
        [slider]
            id="chest_gold"
            default=75
            min=25
            max=500
            step=25
            name= _ "Treasure Chest Gold"
            description= _ "The amount of gold stashed inside the treasure chest on the hill."
        [/slider]
    [/options]

    # scenario specific events
    [event]
        name=prestart
        [objectives]
            [objective]
                description= _ "Defeat enemy leaders"
                condition=win
            [/objective]
            [note]
                description= _ "The treasure chest on the hill keep can only be unlocked by a leader, for a bonus of $chest_gold gold."
            [/note]
            [note]
                description= _ "A side with a leader holding the hill keep gets +$bonus_income gold income each turn."
            [/note]
            [note]
                description= _ "Each side gets two leaders. Whenever a leader is lost then another appears on the recall list at its full cost."
            [/note]
        [/objectives]
        # The hill is always visible to all players.
        [lift_fog]
            location_id=9
            radius=4
            multiturn=yes
        [/lift_fog]
        [remove_shroud]
            location_id=9
            radius=4
        [/remove_shroud]
        # Heirs of computer players try to take the hill keep.
        [micro_ai]
            side=1,2,3,4,5,6,7,8
            ai_type=goto
            action=add
            release_unit_at_goal=yes
            [filter]
                role=heir
            [/filter]
            [filter_location]
                location_id=9
            [/filter_location]
        [/micro_ai]
        # Reclaimers of computer players try to (re)take a home keep.
        [micro_ai]
            side=1,2,3,4,5,6,7,8
            ai_type=goto
            action=add
            release_unit_at_goal=yes
            [filter]
                role=reclaimer
            [/filter]
            [filter_location]
                location_id=1,2,3,4,5,6,7,8
            [/filter_location]
        [/micro_ai]
    [/event]

    # Give each side an heir (a second leader).
    [event]
        name="turn 1 refresh"
        [store_side]
            variable=sides
        [/store_side]
        [foreach]
            array=sides
            [do]
                [if]
                    [have_unit]
                        side=$this_item.side
                    [/have_unit]
                    [then]
                        {SPAWN_HEIR $this_item.side leader}
                    [/then]
                [/if]
            [/do]
        [/foreach]
    [/event]

    # A leader on the hill keep gets a kingly tribute each turn.
    [event]
        name=turn refresh
        first_time_only=no
        [if]
            [have_unit]
                [filter_location]
                    location_id=9
                [/filter_location]
                canrecruit=yes
                side=$side_number
            [/have_unit]
            [then]
                [gold]
                    side=$side_number
                    amount=$bonus_income
                [/gold]
                [scroll_to]
                    location_id=9
                [/scroll_to]
                [floating_text]
                    location_id=9
                    text= _ "<span color='gold'>+$bonus_income gold</span>"
                [/floating_text]
            [/then]
        [/if]
    [/event]

    # If a side loses a leader then put a new heir on its recall list.
    [event]
        name=die
        first_time_only=no
        [filter]
            canrecruit=yes
        [/filter]
        {SPAWN_HEIR $unit.side map}
    [/event]

    # A leader unlocks the hill treasure chest and takes its gold.
    {PLACE_IMAGE items/chest.png 52 51}
    [event]
        name=moveto
        [filter]
            [filter_location]
                location_id=9
            [/filter_location]
            canrecruit=yes
            side=1,2,3,4,5,6,7,8
        [/filter]
        [gold]
            amount=$chest_gold
            side=$unit.side
        [/gold]
        [remove_item]
            x,y=$x1,$y
            image=items/chest.png
        [/remove_item]
        [floating_text]
            x,y=$x1,$y1
            text= _ "<span color='gold'>+$chest_gold gold</span>"
        [/floating_text]
    [/event]

[/multiplayer]

#undef SPAWN_HEIR
