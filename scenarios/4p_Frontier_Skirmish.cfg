#textdomain wesnoth-WoL_Map_Pack
[multiplayer]
    id=multiplayer_4p_Frontier_Skirmish
    name= _ "4p — Frontier Skirmish"
    description= _ "Two nations meet along a border of plains, forests and hills. Western kingdoms against eastern kingdoms, 2 vs 2, with scarce villages: every village counts."
    map_file=4p_Frontier_Skirmish.map
    random_start_time="yes"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=west
        user_team_name= _ "teamname^West"
        fog=yes
        village_gold=3
    [/side]
    [side]
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=east
        user_team_name= _ "teamname^East"
        fog=yes
        village_gold=3
    [/side]
    [side]
        [ai]
            villages_per_scout=8
        [/ai]
        side=3
        canrecruit=yes
        controller=human
        team_name=east
        user_team_name= _ "teamname^East"
        fog=yes
        village_gold=3
    [/side]
    [side]
        [ai]
            villages_per_scout=8
        [/ai]
        side=4
        canrecruit=yes
        controller=human
        team_name=west
        user_team_name= _ "teamname^West"
        fog=yes
        village_gold=3
    [/side]
[/multiplayer]
